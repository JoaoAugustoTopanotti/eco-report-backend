spring.application.name=eco-report
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5440/eco_report
spring.datasource.username=eco_user
spring.datasource.password=eco_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

spring.datasource.driver-class-name=org.postgresql.Driver

eco-report.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB