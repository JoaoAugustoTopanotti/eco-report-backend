services:
  postgres:
    image: postgres:17
    container_name: eco-report-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eco_report
      POSTGRES_USER: eco_user
      POSTGRES_PASSWORD: eco_password
    ports:
      - "5440:5432"
    volumes:
      - eco_report_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eco_user -d eco_report"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: eco-report-app
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eco_report
      SPRING_DATASOURCE_USERNAME: eco_user
      SPRING_DATASOURCE_PASSWORD: eco_password
      UPLOAD_DIR: /app/uploads
      APP_SEED: ${APP_SEED:-false}
    volumes:
      - eco_report_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  eco_report_data:
  eco_report_uploads:
